<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#183c2b">
<title>Site editor | Bisianumu Rubber Plantation</title>
<style>
:root{--forest:#183c2b;--forest2:#244d38;--leaf:#78945e;--lime:#d6e4a5;--cream:#f7f5ed;--paper:#fffef9;--ink:#1d2a21;--muted:#667166;--line:#e4e7dc;--orange:#d78a4a;--danger:#a63d2f;--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.5}
button,input,textarea{font:inherit}
a{color:inherit}
[hidden]{display:none!important}
.gate{min-height:100vh;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
.gate .box{max-width:420px}
.gate h1{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:1.8rem;margin:0 0 8px}

.top{position:sticky;top:0;z-index:20;height:66px;background:var(--forest);color:#fff;display:flex;align-items:center;gap:16px;padding:0 24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-mark{width:36px;height:36px;border-radius:50% 50% 50% 8px;background:#2d5038;display:grid;place-items:center;color:var(--lime);transform:rotate(-8deg)}
.brand-mark svg{transform:rotate(8deg)}
.brand-name{font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.05}
.brand-name small{display:block;font:700 .58rem var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--lime);margin-top:4px}
.spacer{flex:1}
.top a.view{font-size:.84rem;font-weight:700;text-decoration:none;color:var(--lime)}
.top .who{font-size:.78rem;color:#c5d2c4;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:4px;border:1px solid transparent;font-weight:750;font-size:.86rem;cursor:pointer;transition:background .2s,transform .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:progress}
.btn-primary{background:var(--forest);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--forest2)}
.btn-lime{background:var(--lime);color:var(--forest)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.btn-line{background:#fff;border-color:#cbd5c5;color:var(--forest)}
.btn-danger{background:#fff;border-color:#e0b5ad;color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:.78rem}

.layout{display:grid;grid-template-columns:230px 1fr;gap:32px;width:min(1180px,calc(100% - 48px));margin:32px auto 80px;align-items:start}
.tabs{position:sticky;top:90px;display:flex;flex-direction:column;gap:2px}
.tab{text-align:left;border:0;background:none;padding:11px 14px;border-radius:4px;color:#47564a;font-weight:700;font-size:.9rem;cursor:pointer;border-left:3px solid transparent}
.tab:hover{background:#e9ecdf}
.tab[aria-selected="true"]{background:#e9ecdf;color:var(--forest);border-left-color:var(--orange)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:34px 36px 30px;min-width:0}
.panel h1{font-family:var(--serif);font-weight:500;letter-spacing:-.03em;font-size:2.1rem;line-height:1.1;margin:0 0 6px}
.panel .desc{color:var(--muted);margin:0 0 26px;font-size:.93rem;max-width:620px}
.field{display:block;margin-bottom:18px}
.field>span{display:block;font-size:.8rem;font-weight:700;color:#47564a;margin-bottom:6px}
.field small{display:block;color:var(--muted);font-size:.76rem;margin-top:5px}
input[type=text],input[type=password],textarea{width:100%;padding:11px 13px;border:1px solid #cbd5c5;border-radius:4px;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{outline:3px solid rgba(215,138,74,.4);outline-offset:1px;border-color:var(--orange)}
.sec{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);font-weight:800;margin:30px 0 14px;padding-top:22px;border-top:1px solid var(--line)}
.sec:first-of-type{margin-top:0;padding-top:0;border-top:0}
.imgfield{display:flex;gap:14px;align-items:flex-start}
.imgfield img{width:132px;height:88px;object-fit:cover;border:1px solid var(--line);background:#e8eddf;border-radius:3px;flex:none}
.imgfield .ctl{flex:1;min-width:0}
.imgfield .ctl .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.items{display:grid;gap:14px;margin:6px 0 16px}
.item{border:1px solid var(--line);border-radius:5px;background:#fbfbf4;padding:16px 18px 6px}
.item.hidden-photo{opacity:.65}
.item-head{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.item-head b{font-family:var(--serif);font-weight:500;font-size:1.05rem;flex:1}
.check{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:700;color:#47564a;margin:0 0 14px}
.check input{width:18px;height:18px;accent-color:var(--forest)}
.empty{color:var(--muted);font-size:.9rem;border:1px dashed #cbd5c5;border-radius:5px;padding:20px;text-align:center}

.arow .item-head{flex-wrap:wrap;margin-bottom:10px}
.arow .item-head b{min-width:120px;word-break:break-all}
.badge{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--lime);color:var(--forest);padding:3px 8px;border-radius:20px}
.arow small{display:block;color:var(--muted);font-size:.78rem;margin:-4px 0 12px}
.pwform{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.pwform input{flex:1;min-width:200px}
.pwrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formmsg{display:none;margin:0 0 14px;padding:10px 14px;border-radius:4px;font-size:.88rem;background:#f8e5e1;color:var(--danger);border:1px solid #e9c1b9}
.formmsg.show{display:block}
@media(max-width:860px){.pwrow{grid-template-columns:1fr}}
.savebar{position:sticky;bottom:0;margin:28px -36px -30px;padding:16px 36px;background:rgba(255,254,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;border-radius:0 0 6px 6px}
.savebar .state{font-size:.84rem;color:var(--muted)}
.savebar .state.dirty{color:var(--orange);font-weight:700}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--forest);color:#fff;padding:12px 20px;border-radius:4px;font-size:.88rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.error{background:var(--danger)}

@media(max-width:860px){
  .top{padding:0 16px;height:60px}.top .who{display:none}
  .layout{grid-template-columns:1fr;gap:16px;width:calc(100% - 32px);margin-top:20px}
  .tabs{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .tab{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:10px 12px}
  .tab[aria-selected="true"]{border-bottom-color:var(--orange)}
  .panel{padding:24px 20px 22px}
  .savebar{margin:24px -20px -22px;padding:14px 20px}
  .imgfield{flex-direction:column}.imgfield img{width:100%;height:150px}
}
</style>
</head>
<body>

<div class="gate" id="gate"><div class="box"><h1>Checking your session…</h1><p>One moment.</p></div></div>

<div id="app" hidden>
  <header class="top">
    <a class="brand" href="/admin/">
      <span class="brand-mark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21V10M12 14C4 14 3 7 4 4c5 0 8 2 8 8M12 11C12 5 16 2 21 3c1 6-2 9-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-name">Site editor<small>Bisianumu</small></span>
    </a>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <a class="view" href="/" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn btn-ghost btn-sm" id="signout" type="button">Sign out</button>
  </header>
  <div class="layout">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <main class="panel" id="panel"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
(function () {
  const cfg = window.SITE_CONFIG;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- What can be edited ----------
  const GROUPS = [
    { id: 'menu', label: 'Navigation menu', title: 'Navigation menu',
      desc: 'The links at the top of every page (and in the footer). The last one is the highlighted button.',
      fields: [
        { k: 'nav_story',   label: 'Menu link 1', hint: 'Jumps to the "Our story" section' },
        { k: 'nav_work',    label: 'Menu link 2', hint: 'Jumps to the process section' },
        { k: 'nav_gallery', label: 'Menu link 3', hint: 'Jumps to the gallery' },
        { k: 'nav_cta',     label: 'Menu button', hint: 'Jumps to the contact section' }
      ] },
    { id: 'hero', label: 'Home banner', title: 'Home banner',
      desc: 'The large opening section at the top of the home page.',
      fields: [
        { k: 'hero_eyebrow', label: 'Small heading' },
        { k: 'hero_title_1', label: 'Title, line 1' },
        { k: 'hero_title_2', label: 'Title, line 2 (shown in lime italics)' },
        { k: 'hero_copy',    label: 'Intro text', type: 'textarea' },
        { k: 'hero_note',    label: 'Note under the buttons' },
        { k: 'hero_index',   label: 'Vertical side text (desktop only)' },
        { k: 'hero_image_url',        label: 'Banner photo (desktop)', type: 'image', folder: 'hero' },
        { k: 'hero_image_mobile_url', label: 'Banner photo (phones)',  type: 'image', folder: 'hero', hint: 'Leave the same as desktop if you only have one.' }
      ] },
    { id: 'story', label: 'Our story', title: 'Our story',
      desc: 'History and heritage section.',
      fields: [
        { k: 'story_eyebrow',   label: 'Small heading' },
        { k: 'story_title',     label: 'Heading' },
        { k: 'story_p1',        label: 'Paragraph 1', type: 'textarea' },
        { k: 'story_p2',        label: 'Paragraph 2', type: 'textarea' },
        { k: 'story_p3',        label: 'Paragraph 3', type: 'textarea' },
        { k: 'story_signature', label: 'Line under the story' }
      ] },
    { id: 'pillars', label: 'Pillars', title: 'Pillars',
      desc: 'The three numbered boxes under the story. You can add, remove and reorder them.',
      fields: [{ k: 'pillars_eyebrow', label: 'Small heading' }],
      list: 'pillars' },
    { id: 'process', label: 'The process', title: 'The process',
      desc: 'The stages of the rubber harvest. Icons are assigned automatically in order.',
      fields: [
        { k: 'process_eyebrow', label: 'Small heading' },
        { k: 'process_title',   label: 'Heading' },
        { k: 'process_intro',   label: 'Intro text', type: 'textarea' }
      ],
      list: 'process_stages' },
    { id: 'gallery', label: 'Gallery', title: 'Gallery',
      desc: 'Photos shown on the site. Untick "Show on website" to hide a photo without deleting it.',
      fields: [
        { k: 'gallery_eyebrow', label: 'Small heading' },
        { k: 'gallery_title',   label: 'Heading' },
        { k: 'gallery_intro',   label: 'Intro text', type: 'textarea' }
      ],
      list: 'gallery_photos' },
    { id: 'quote', label: 'Quote', title: 'Quote band',
      desc: 'The dark green quote section.',
      fields: [
        { k: 'quote_text',   label: 'Quote', type: 'textarea' },
        { k: 'quote_credit', label: 'Credit line' }
      ] },
    { id: 'contact', label: 'Contact', title: 'Contact',
      desc: 'Phone and email appear on the site only once you fill them in.',
      fields: [
        { k: 'contact_eyebrow',    label: 'Small heading' },
        { k: 'contact_title',      label: 'Heading' },
        { k: 'contact_text',       label: 'Text', type: 'textarea' },
        { k: 'contact_side_title', label: 'Side box title' },
        { k: 'contact_address',    label: 'Address' },
        { k: 'contact_phone',      label: 'Phone number', hint: 'Optional' },
        { k: 'contact_email',      label: 'Email address', hint: 'Optional' },
        { k: 'contact_side_text',  label: 'Side box note', type: 'textarea' }
      ] },
    { id: 'footer', label: 'Footer & search', title: 'Footer and search listing',
      desc: 'The footer tagline, plus the page title and description shown in browser tabs and Google.',
      fields: [
        { k: 'footer_tagline',   label: 'Footer tagline' },
        { k: 'site_title',       label: 'Page title (browser tab)' },
        { k: 'site_description', label: 'Page description (search engines)', type: 'textarea' }
      ] },
    { id: 'admins', label: 'Admins', title: 'Admin accounts', custom: true,
      desc: 'Everyone listed here can sign in and edit the website. Create a username and password for each person.' }
  ];

  const LISTS = {
    pillars: { noun: 'Pillar', fields: [
      { k: 'title', label: 'Title' }, { k: 'body', label: 'Text', type: 'textarea' }] },
    process_stages: { noun: 'Stage', fields: [
      { k: 'title', label: 'Title' }, { k: 'body', label: 'Text', type: 'textarea' }] },
    gallery_photos: { noun: 'Photo', fields: [
      { k: 'image_url', label: 'Image', type: 'image', folder: 'gallery' },
      { k: 'title', label: 'Title' },
      { k: 'description', label: 'Caption', type: 'textarea' },
      { k: 'visible', label: 'Show on website', type: 'check' }] }
  };

  // ---------- State ----------
  const sb = window.supabase ? window.supabase.createClient(cfg.url, cfg.key) : null;
  let content = {};
  const lists = {};           // table -> { items: [...], deleted: [ids] }
  let current = GROUPS[0].id;
  let dirty = false;

  function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = ''; }, isError ? 5200 : 2600);
  }
  function setDirty(v) {
    dirty = v;
    const s = document.querySelector('.savebar .state');
    if (s) { s.textContent = v ? 'Unsaved changes' : 'All changes saved'; s.className = 'state' + (v ? ' dirty' : ''); }
  }
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- Gate ----------
  function gateMessage(title, text, withSignOut) {
    $('gate').hidden = false;
    $('app').hidden = true;
    $('gate').innerHTML = '<div class="box"><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p>' +
      '<p><a class="btn btn-primary" href="/login/">Go to sign in</a></p></div>';
    if (withSignOut) sb.auth.signOut();
  }

  async function start() {
    if (!sb) return gateMessage('Could not load', 'The editor library did not load. Check your connection and refresh.');
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return location.replace('/login/');
    const { data: adminRow, error } = await sb.from('admins').select('user_id').maybeSingle();
    if (error || !adminRow) return gateMessage('No admin access', 'This account is not on the admin list. Ask the site owner to add you.', true);
    $('who').textContent = cfg.toDisplayName(session.user.email);
    $('gate').hidden = true;
    $('app').hidden = false;
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.replace('/login/'); });
    await loadAll();
    renderTabs();
    renderPanel();
  }

  async function loadAll() {
    const [c, p, s, g] = await Promise.all([
      sb.from('site_content').select('key,value'),
      sb.from('pillars').select('*').order('position'),
      sb.from('process_stages').select('*').order('position'),
      sb.from('gallery_photos').select('*').order('position')
    ]);
    for (const r of [c, p, s, g]) if (r.error) { toast('Could not load: ' + r.error.message, true); }
    content = {};
    (c.data || []).forEach(r => { content[r.key] = r.value; });
    lists.pillars = { items: p.data || [], deleted: [] };
    lists.process_stages = { items: s.data || [], deleted: [] };
    lists.gallery_photos = { items: g.data || [], deleted: [] };
  }

  // ---------- Rendering ----------
  function renderTabs() {
    $('tabs').innerHTML = GROUPS.map(g =>
      '<button class="tab" role="tab" data-id="' + g.id + '" aria-selected="' + (g.id === current) + '">' + esc(g.label) + '</button>').join('');
  }

  function fieldHTML(f, val, attrs) {
    const hint = f.hint ? '<small>' + esc(f.hint) + '</small>' : '';
    if (f.type === 'textarea')
      return '<label class="field"><span>' + esc(f.label) + '</span><textarea ' + attrs + '>' + esc(val) + '</textarea>' + hint + '</label>';
    if (f.type === 'check')
      return '<label class="check"><input type="checkbox" ' + attrs + (val ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
    if (f.type === 'image')
      return '<div class="field"><span>' + esc(f.label) + '</span><div class="imgfield">' +
        '<img alt="" src="' + esc(val || '') + '" ' + (val ? '' : 'hidden') + '>' +
        '<div class="ctl"><input type="text" ' + attrs + ' value="' + esc(val || '') + '" placeholder="Image address">' +
        '<div class="row"><label class="btn btn-line btn-sm" style="margin:0">Upload new photo<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="' + esc(f.folder || 'misc') + '" hidden></label></div>' + hint + '</div></div></div>';
    return '<label class="field"><span>' + esc(f.label) + '</span><input type="text" ' + attrs + ' value="' + esc(val) + '">' + hint + '</label>';
  }

  function listHTML(name) {
    const L = LISTS[name], st = lists[name];
    if (!st.items.length) return '<div class="empty">Nothing here yet. Use the button below to add one.</div>';
    return '<div class="items">' + st.items.map((it, i) => {
      const body = L.fields.map(f => fieldHTML(f, it[f.k], 'data-list="' + name + '" data-i="' + i + '" data-f="' + f.k + '"')).join('');
      return '<div class="item' + (name === 'gallery_photos' && it.visible === false ? ' hidden-photo' : '') + '">' +
        '<div class="item-head"><b>' + L.noun + ' ' + (i + 1) + '</b>' +
        '<button class="btn btn-line btn-sm" type="button" data-act="up" data-list="' + name + '" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Move up">↑</button>' +
        '<button class="btn btn-line btn-sm" type="button" data-act="down" data-list="' + name + '" data-i="' + i + '"' + (i === st.items.length - 1 ? ' disabled' : '') + ' aria-label="Move down">↓</button>' +
        '<button class="btn btn-danger btn-sm" type="button" data-act="del" data-list="' + name + '" data-i="' + i + '">Delete</button></div>' +
        body + '</div>';
    }).join('') + '</div>';
  }

  function renderPanel() {
    const g = GROUPS.find(x => x.id === current);
    if (g.custom) return renderAdmins(g);
    let html = '<h1>' + esc(g.title) + '</h1><p class="desc">' + esc(g.desc) + '</p>';
    html += g.fields.map(f => fieldHTML(f, content[f.k], 'data-key="' + f.k + '"')).join('');
    if (g.list) {
      const L = LISTS[g.list];
      html += '<div class="sec">' + L.noun + 's</div><div id="listbox">' + listHTML(g.list) + '</div>' +
        '<button class="btn btn-line" type="button" data-act="add" data-list="' + g.list + '">+ Add ' + L.noun.toLowerCase() + '</button>';
    }
    html += '<div class="savebar"><button class="btn btn-primary" id="save" type="button">Save changes</button><span class="state">All changes saved</span></div>';
    $('panel').innerHTML = html;
    setDirty(false);
  }

  function rerenderList(name) {
    $('listbox').innerHTML = listHTML(name);
  }

  // ---------- Images ----------
  async function prepareImage(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error('Please choose a JPG, PNG or WebP image.');
    if (file.size > 20 * 1024 * 1024) throw new Error('That image is over 20 MB.');
    try {
      const bmp = await createImageBitmap(file);
      const max = 2200, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
      if (s === 1 && file.size < 1.5 * 1024 * 1024) return file;
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
      return blob ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
    } catch (e) { return file; }
  }

  async function uploadImage(file, folder) {
    const f = await prepareImage(file);
    const safe = f.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '') || 'photo.jpg';
    const path = folder + '/' + Date.now() + '-' + safe;
    const { error } = await sb.storage.from(cfg.bucket).upload(path, f, { cacheControl: '31536000', contentType: f.type });
    if (error) throw error;
    return sb.storage.from(cfg.bucket).getPublicUrl(path).data.publicUrl;
  }

  // ---------- Saving ----------
  async function saveList(name) {
    const L = LISTS[name], st = lists[name];
    if (name === 'gallery_photos' && st.items.some(i => !i.image_url)) throw new Error('Every photo needs an image. Upload one or delete the empty photo.');
    if (st.deleted.length) {
      const { error } = await sb.from(name).delete().in('id', st.deleted);
      if (error) throw error;
      st.deleted = [];
    }
    const now = new Date().toISOString();
    for (let i = 0; i < st.items.length; i++) {
      const it = st.items[i];
      const row = { position: i + 1, updated_at: now };
      L.fields.forEach(f => { row[f.k] = f.type === 'check' ? !!it[f.k] : (it[f.k] == null ? '' : it[f.k]); });
      if (it.id) {
        const { error } = await sb.from(name).update(row).eq('id', it.id);
        if (error) throw error;
      } else {
        const { data, error } = await sb.from(name).insert(row).select('id').single();
        if (error) throw error;
        it.id = data.id;
      }
    }
  }

  async function saveCurrent() {
    const g = GROUPS.find(x => x.id === current);
    const btn = $('save');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const now = new Date().toISOString();
      const rows = g.fields.map(f => {
        const el = document.querySelector('[data-key="' + f.k + '"]');
        return { key: f.k, value: el ? el.value.trim() : '', updated_at: now };
      });
      const { error } = await sb.from('site_content').upsert(rows, { onConflict: 'key' });
      if (error) throw error;
      rows.forEach(r => { content[r.key] = r.value; });
      if (g.list) { await saveList(g.list); rerenderList(g.list); }
      setDirty(false);
      toast('Saved. The live site updates straight away.');
    } catch (e) {
      toast(e.message || 'Could not save. Please try again.', true);
    } finally {
      btn.disabled = false; btn.textContent = 'Save changes';
    }
  }

  // ---------- Events ----------
  $('tabs').addEventListener('click', async e => {
    const b = e.target.closest('.tab');
    if (!b || b.dataset.id === current) return;
    if (dirty && !confirm('You have unsaved changes. Leave this section and lose them?')) return;
    if (dirty) await loadAll();
    current = b.dataset.id;
    renderTabs(); renderPanel();
  });

  $('panel').addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.key) { setDirty(true); if (t.type === 'text' && t.closest('.imgfield')) previewImg(t); return; }
    if (t.dataset.list) {
      const it = lists[t.dataset.list].items[+t.dataset.i], f = t.dataset.f;
      it[f] = t.type === 'checkbox' ? t.checked : t.value;
      if (f === 'visible') t.closest('.item').classList.toggle('hidden-photo', !t.checked);
      if (t.type === 'text' && t.closest('.imgfield')) previewImg(t);
      setDirty(true);
    }
  });

  function previewImg(input) {
    const img = input.closest('.imgfield').querySelector('img');
    const v = input.value.trim();
    if (v) { img.src = v; img.hidden = false; } else { img.hidden = true; }
  }

  $('panel').addEventListener('change', async e => {
    const t = e.target;
    if (!t.matches('input[type=file][data-upload]') || !t.files[0]) return;
    const file = t.files[0];
    const holder = t.closest('.imgfield');
    const textInput = holder.querySelector('input[type=text]');
    const label = t.closest('label');
    const original = label.firstChild.textContent;
    label.firstChild.textContent = 'Uploading…';
    try {
      const url = await uploadImage(file, t.dataset.upload);
      textInput.value = url;
      textInput.dispatchEvent(new Event('input', { bubbles: true }));
      toast('Photo uploaded. Click Save changes to publish it.');
    } catch (err) {
      toast(err.message || 'Upload failed.', true);
    } finally {
      label.firstChild.textContent = original;
      t.value = '';
    }
  });

  $('panel').addEventListener('click', e => {
    if (e.target.closest('#save')) return saveCurrent();
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act.indexOf('admin-') === 0) return adminClick(b);
    const name = b.dataset.list, st = lists[name], i = +b.dataset.i, act = b.dataset.act;
    if (act === 'add') {
      const blank = name === 'gallery_photos'
        ? { title: '', description: '', image_url: '', visible: true }
        : { title: '', body: '' };
      st.items.push(blank);
    } else if (act === 'del') {
      if (!confirm('Delete this ' + LISTS[name].noun.toLowerCase() + '? This is applied when you click Save changes.')) return;
      const [gone] = st.items.splice(i, 1);
      if (gone.id) st.deleted.push(gone.id);
    } else if (act === 'up' && i > 0) {
      [st.items[i - 1], st.items[i]] = [st.items[i], st.items[i - 1]];
    } else if (act === 'down' && i < st.items.length - 1) {
      [st.items[i + 1], st.items[i]] = [st.items[i], st.items[i + 1]];
    }
    rerenderList(name);
    setDirty(true);
  });

  // ---------- Admin accounts ----------
  const adminUI = { list: null, pwFor: null };
  const USERNAME_RE = /^[a-z0-9._-]{3,32}$/;

  async function callAdmin(action, payload) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.replace('/login/'); throw new Error('You have been signed out.'); }
    let res;
    try {
      res = await fetch(cfg.url + '/functions/v1/admin-users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: cfg.key, Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify(Object.assign({ action: action }, payload || {}))
      });
    } catch (e) { throw new Error('Could not reach the server. Check your connection.'); }
    let data = {};
    try { data = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ').');
    return data;
  }

  function renderAdmins(g) {
    adminUI.list = null; adminUI.pwFor = null;
    $('panel').innerHTML =
      '<h1>' + esc(g.title) + '</h1><p class="desc">' + esc(g.desc) + '</p>' +
      '<div class="sec">Current admins</div><div id="adminlist"><div class="empty">Loading…</div></div>' +
      '<div class="sec">Add an admin</div>' +
      '<form id="addadmin" autocomplete="off" novalidate>' +
        '<p class="formmsg" id="addmsg" role="alert"></p>' +
        '<label class="field"><span>Username</span><input type="text" name="username" autocapitalize="none" spellcheck="false" autocomplete="off" maxlength="32">' +
          '<small>3 to 32 characters: lowercase letters, numbers, dot, dash or underscore. Example: <b>mary.k</b></small></label>' +
        '<div class="pwrow">' +
          '<label class="field"><span>Password</span><input type="password" name="password" autocomplete="new-password" maxlength="72"><small>At least 10 characters.</small></label>' +
          '<label class="field"><span>Repeat password</span><input type="password" name="confirm" autocomplete="new-password" maxlength="72"></label>' +
        '</div>' +
        '<label class="check"><input type="checkbox" id="showpw"> Show passwords</label>' +
        '<button class="btn btn-primary" id="addbtn" type="submit">Create admin</button>' +
      '</form>';
    setDirty(false);
    loadAdmins();
  }

  async function loadAdmins() {
    try {
      const out = await callAdmin('list');
      if (!$('adminlist')) return;               // user switched tabs meanwhile
      adminUI.list = out.admins || [];
      drawAdmins();
    } catch (e) {
      if ($('adminlist')) $('adminlist').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    }
  }

  function drawAdmins() {
    const box = $('adminlist');
    if (!box) return;
    if (!adminUI.list.length) { box.innerHTML = '<div class="empty">No admins yet.</div>'; return; }
    box.innerHTML = '<div class="items">' + adminUI.list.map(a => {
      const name = a.username || a.email || 'Admin';
      const open = adminUI.pwFor === a.user_id;
      return '<div class="item arow"><div class="item-head"><b>' + esc(name) + '</b>' +
        (a.is_self ? '<span class="badge">You</span>' : '') +
        '<button class="btn btn-line btn-sm" type="button" data-act="admin-pw" data-id="' + esc(a.user_id) + '">' + (a.is_self ? 'Change my password' : 'Reset password') + '</button>' +
        (a.is_self ? '' : '<button class="btn btn-danger btn-sm" type="button" data-act="admin-del" data-id="' + esc(a.user_id) + '" data-name="' + esc(name) + '">Remove</button>') +
        '</div>' +
        (a.username ? '' : '<small>Signs in with an email address</small>') +
        (open ? '<form class="pwform" data-pwform="' + esc(a.user_id) + '" autocomplete="off">' +
          '<input type="password" placeholder="New password (10+ characters)" autocomplete="new-password" maxlength="72" required>' +
          '<button class="btn btn-primary btn-sm" type="submit">Save password</button>' +
          '<button class="btn btn-line btn-sm" type="button" data-act="admin-pw-cancel">Cancel</button></form>' : '') +
        '</div>';
    }).join('') + '</div>';
    const f = box.querySelector('.pwform input');
    if (f) f.focus();
  }

  async function adminClick(b) {
    const act = b.dataset.act;
    if (act === 'admin-pw') { adminUI.pwFor = b.dataset.id; return drawAdmins(); }
    if (act === 'admin-pw-cancel') { adminUI.pwFor = null; return drawAdmins(); }
    if (act === 'admin-del') {
      if (!confirm('Remove "' + b.dataset.name + '"? They will no longer be able to sign in.')) return;
      b.disabled = true;
      try { await callAdmin('delete', { user_id: b.dataset.id }); toast('Admin removed.'); }
      catch (e) { toast(e.message, true); }
      loadAdmins();
    }
  }

  function formMsg(text) { const m = $('addmsg'); if (!m) return; m.textContent = text || ''; m.className = 'formmsg' + (text ? ' show' : ''); }

  $('panel').addEventListener('change', e => {
    if (e.target.id === 'showpw') document.querySelectorAll('#addadmin input[type=password], #addadmin input[data-pw]').forEach(i => { i.type = e.target.checked ? 'text' : 'password'; });
  });

  $('panel').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    if (form.id === 'addadmin') {
      const username = form.username.value.trim().toLowerCase();
      const pw = form.password.value, confirmPw = form.confirm.value;
      if (!USERNAME_RE.test(username)) return formMsg('Username must be 3 to 32 characters: letters, numbers, dot, dash or underscore.');
      if (pw.length < 10) return formMsg('Password must be at least 10 characters.');
      if (pw !== confirmPw) return formMsg('The two passwords do not match.');
      formMsg('');
      const btn = $('addbtn'); btn.disabled = true; btn.textContent = 'Creating…';
      try {
        await callAdmin('create', { username: username, password: pw });
        toast('Admin "' + username + '" created. Share the password with them privately.');
        form.reset();
        loadAdmins();
      } catch (err) { formMsg(err.message); }
      finally { btn.disabled = false; btn.textContent = 'Create admin'; }
    } else if (form.dataset.pwform) {
      const input = form.querySelector('input');
      if (input.value.length < 10) return toast('Password must be at least 10 characters.', true);
      const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
      try {
        await callAdmin('set_password', { user_id: form.dataset.pwform, password: input.value });
        adminUI.pwFor = null;
        toast('Password updated.');
        drawAdmins();
      } catch (err) { toast(err.message, true); btn.disabled = false; }
    }
  });

  $('signout').addEventListener('click', async () => {
    if (dirty && !confirm('You have unsaved changes. Sign out anyway?')) return;
    dirty = false;
    await sb.auth.signOut();
    location.replace('/login/');
  });

  start();
})();
</script>
</body>
</html>
